<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JSONP Bridge</title>
</head>
<body>
    <script>
        (async () => {
            const params = new URLSearchParams(location.search);
            const feedUrl = params.get('feed'); // 获取要抓取的 RSS URL
            const callbackName = params.get('callback'); // 获取回调函数名

            // 基本参数验证
            if (!feedUrl || !callbackName) {
                const errorResponse = { error: { message: "错误：缺少 'feed' 或 'callback' URL 参数。" } };
                // 必须用 document.write 输出，因为这是 <script> 标签请求的响应
                document.write(`${callbackName || 'jsonpCallback'}(${JSON.stringify(errorResponse)});`);
                console.error("JSONP Bridge Error: Missing parameters.");
                return;
            }

            // 验证回调函数名（防止基本的注入）
            if (!/^[a-zA-Z0-9_]+$/.test(callbackName)) {
                 const errorResponse = { error: { message: "错误：无效的 'callback' 参数名称。" } };
                 document.write(`jsonpCallback(${JSON.stringify(errorResponse)});`); // Use default if name is invalid
                 console.error("JSONP Bridge Error: Invalid callback name.");
                 return;
            }

            try {
                // 使用 fetch 抓取目标 RSS Feed
                console.log(`JSONP Bridge: Fetching ${feedUrl}`);
                const response = await fetch(feedUrl, {
                    headers: { // 添加 User-Agent 可能有助于避免被某些服务器阻止
                       'User-Agent': 'GitHubPages-JSONP-Bridge/1.0 (+https://darside2002.github.io/JS-neocities-bridge/)' // 修改为你自己的信息
                    }
                });

                console.log(`JSONP Bridge: Fetch status for ${feedUrl}: ${response.status}`);

                if (!response.ok) {
                    // 如果 fetch 失败，也通过 JSONP 返回错误
                    throw new Error(`无法获取 Feed: ${response.status} ${response.statusText}`);
                }

                const feedContent = await response.text(); // 获取原始 XML/文本内容

                 // 检查内容是否为空
                 if (!feedContent || feedContent.trim().length === 0) {
                    throw new Error(`从 ${feedUrl} 获取到的内容为空。`);
                 }

                // 准备 JSONP 响应数据结构
                const jsonpData = {
                    contents: feedContent, // 将原始 XML 字符串放入 contents 字段
                    status: { // 模拟 AllOrigins 的状态结构
                        url: feedUrl,
                        http_code: response.status,
                        content_type: response.headers.get('Content-Type') || 'unknown'
                    }
                };

                // 输出 JSONP 响应: callbackName({...});
                // 使用 JSON.stringify 来确保内容被正确转义为 JavaScript 字符串
                document.write(`${callbackName}(${JSON.stringify(jsonpData)});`);
                console.log(`JSONP Bridge: Successfully returned data for ${feedUrl}`);

            } catch (error) {
                // 如果过程中出现任何错误，都通过 JSONP 返回错误信息
                console.error("JSONP Bridge Error:", error);
                const errorResponse = {
                    error: {
                        message: error.message || '处理 Feed 时发生未知错误。',
                        url: feedUrl // 包含失败的 URL 以便调试
                    },
                     status: { // 也包含状态信息
                        url: feedUrl,
                        http_code: 500, // Assume server error if fetch failed internally
                        content_type: 'unknown'
                    }
                };
                // 确保即使在错误情况下也调用回调函数
                document.write(`${callbackName}(${JSON.stringify(errorResponse)});`);
            }
        })();
    </script>
</body>
</html>
